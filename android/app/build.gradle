plugins {
    id 'com.android.application'
}

android {
    namespace 'com.murcalendar.feeding'
    compileSdk 34

    defaultConfig {
        applicationId "com.murcalendar.feeding"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "1.7.3"
    }

    // Stable shared debug keystore (committed under android/).
    // ALL debug and release APKs for sideload use the same cert so updates
    // do not hit INSTALL_FAILED_UPDATE_INCOMPATIBLE ("конфликтует с другим пакетом").
    // Never regenerate android/mur-calendar-debug.keystore.
    signingConfigs {
        murDebug {
            storeFile file('../mur-calendar-debug.keystore')
            storePassword 'murcalendar'
            keyAlias 'murcalendardebug'
            keyPassword 'murcalendar'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.murDebug
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.murDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Minimal: platform WebView only — no AppCompat/Kotlin conflict for v1
}
